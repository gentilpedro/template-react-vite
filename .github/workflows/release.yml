name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="1.0.${{ github.run_number }}"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes

      - name: Publish create-gentilpedro-react to npm (OIDC trusted publishing)
        run: |
          npm install -g npm@latest
          node create-app/sync-template.mjs
          cd create-app
          npm version "1.0.${{ github.run_number }}" --no-git-tag-version
          npm publish --access public

      - name: Mirror to GitHub Packages (cosmetic — shows in repo sidebar)
        run: |
          cd create-app
          npm pkg set name="@gentilpedro/create-gentilpedro-react"
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          npm publish --registry=https://npm.pkg.github.com
